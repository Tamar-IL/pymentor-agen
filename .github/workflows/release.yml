# Builds agent.exe on Windows and attaches it (plus the store zip) to a GitHub Release.
# Trigger: on GitHub, Releases -> "Draft a new release" -> tag v1.0.0 -> Publish.
# (A manual run from the Actions tab builds the files as a downloadable artifact only.)
name: Build agent.exe and release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (offline, no API key needed)
        run: python -m pytest -q

      - name: Build agent.exe with PyInstaller
        run: pyinstaller --onefile --console --name agent --collect-submodules langgraph --collect-submodules langchain_openai main.py

      - name: Smoke test - the exe starts and exits cleanly
        shell: bash
        run: printf 'help\nexit\n' | OPENROUTER_API_KEY=dummy ./dist/agent.exe

      - name: Package source zip for the Safe-Agents catalog (manifest runtime.source_url)
        shell: bash
        run: |
          git archive --format=zip --prefix=pymentor-agen/ -o pymentor-agen.zip HEAD
          echo "sha256 for registry.json:"
          sha256sum pymentor-agen.zip | tee pymentor-agen.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/agent.exe
            pymentor-agen.zip
            pymentor-agen.zip.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent.exe
            pymentor-agen.zip
            pymentor-agen.zip.sha256
